[project]
name = "carelens"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.14.0",
    "prometheus-client>=0.21.0",
    "typer>=0.13.0",
    "alembic>=1.18.5",
    "psycopg>=3.3.4",
    "python-keycloak>=7.1.1",
    "email-validator>=2.2.0",
]

[project.scripts]
synthdata = "synthdata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "synthdata", "workers"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/conftest.py's `postgres` fixture is session-scoped (one testcontainers
# Postgres + one async engine/pool for the whole run) -- the event loop needs to
# match that scope, or the pool ends up bound to a stale loop after the first test
# and crashes on teardown with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# migrations/ is Alembic-managed (applied, historical schema records plus its own
# generated env.py) -- not restyled to our conventions.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default-arg is the idiomatic pattern, not a bug
    "UP042", # (str, Enum) is deliberate here for SQLAlchemy's Enum() + JSON serialization
]

[tool.ruff.lint.per-file-ignores]
# Reference lists and generated-row dict literals are inherently wide; wrapping them
# hurts readability more than it helps.
"synthdata/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
