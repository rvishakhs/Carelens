name: care-intelligence
services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8100:8100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/readyz')"]
      interval: 15s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: intelligence-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${INTELLIGENCE_REDIS_PORT:-6380}:6379"
    volumes:
      - intelligence_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  intelligence_redis_data:
# Deliberately no shared CareLens network, database, secrets or volumes.
# PostgreSQL/Temporal are delivery milestones, not unused running dependencies.
