name: care-intelligence
services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8100:8100"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/readyz')"]
      interval: 15s
      timeout: 3s
      retries: 3

  dispatcher:
    profiles: ["handover"]
    build: .
    env_file: .env
    command: ["python", "-m", "intelligence.dispatcher"]
    environment:
      INTELLIGENCE_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    profiles: ["handover"]
    build: .
    env_file: .env
    command: ["celery", "-A", "intelligence.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      INTELLIGENCE_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  recovery-worker:
    profiles: [ "handover" ]
    build: .
    env_file: .env
    command:
      - celery
      - -A
      - intelligence.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=intelligence.maintenance
      - --concurrency=1
    environment:
      INTELLIGENCE_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [ /tmp ]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]

  beat:
    profiles: [ "handover" ]
    build: .
    env_file: .env
    command:
      - celery
      - -A
      - intelligence.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      INTELLIGENCE_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [ /tmp ]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]

  redis:
    image: redis:7-alpine
    container_name: intelligence-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${INTELLIGENCE_REDIS_PORT:-6380}:6379"
    volumes:
      - intelligence_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  intelligence_redis_data:
# Deliberately no shared CareLens network, database, secrets or volumes.
# PostgreSQL is configured separately. Background processes are opt-in via the handover profile.
